name: Hoop Master CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npx turbo build --filter=web
