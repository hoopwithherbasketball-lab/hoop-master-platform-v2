name: Guardrail Validation

on:
  pull_request:
    paths:
      - 'config/**'
      - 'docs/**'
      - 'agents/**'
      - '.github/**'
      - 'scripts/**'
      - '*.md'
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'docs/**'
      - 'agents/**'
      - '.github/**'
      - 'scripts/**'
      - '*.md'

jobs:
  validate-agent-runtime:
    name: Validate agent runtime guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run runtime boundary validation
        run: ./scripts/ci/validate-agent-runtime.sh
