name: HWH AGILE Policy

on:
  pull_request:
    paths:
      - 'scripts/hwh-agile*.mjs'
      - 'HWH_AGILE.md'
      - 'package.json'
      - '.github/workflows/hwh-agile-policy.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hwh-agile*.mjs'
      - 'HWH_AGILE.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/hwh-agile-policy.test.mjs
